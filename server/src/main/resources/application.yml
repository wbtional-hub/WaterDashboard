spring:
  application:
    name: water-dashboard-server
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/water_dashboard}
    username: ${PLATFORM_DB_USERNAME:water_dashboard}
    password: ${PLATFORM_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: WaterDashboardPlatformPool
      maximum-pool-size: ${PLATFORM_DB_POOL_SIZE:10}
      connection-timeout: ${PLATFORM_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${PLATFORM_DB_VALIDATION_TIMEOUT_MS:3000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${FLYWAY_URL:${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/water_dashboard}}
    user: ${FLYWAY_USER:${PLATFORM_DB_USERNAME:water_dashboard}}
    password: ${FLYWAY_PASSWORD:${PLATFORM_DB_PASSWORD:}}
    locations: classpath:db/migration
    schemas: platform
    default-schema: platform
    create-schemas: true
    validate-on-migrate: true
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}

app:
  version: 0.1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"
